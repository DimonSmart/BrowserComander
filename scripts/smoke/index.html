<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrowserCommander Smoke</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(160deg, #f3f7ff 0%, #eef9f1 100%);
            color: #1d2838;
        }

        main {
            width: min(680px, calc(100vw - 32px));
            padding: 24px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 24px 70px rgba(40, 66, 110, 0.12);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        textarea {
            width: 100%;
            min-height: 160px;
            margin-top: 16px;
            padding: 14px 16px;
            font: inherit;
            border: 1px solid #c6d4eb;
            border-radius: 12px;
            resize: vertical;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <main>
        <h1>BrowserCommander Smoke</h1>
        <p>This page is used to validate the end-to-end browser automation PoC.</p>
        <textarea id="target-textarea" placeholder="The extension should update this field."></textarea>
    </main>
</body>
</html>
