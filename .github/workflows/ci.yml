name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate extension JavaScript syntax
        run: node --check BrowserCommander/wwwroot/background-agent.js
      - name: Background worker unit tests
        run: node --test scripts/background-agent.test.cjs
      - name: Build solution
        run: dotnet build BrowserComander.sln -c Release
      - name: Unit tests
        run: dotnet test BrowserCommanderServer.Tests/BrowserCommanderServer.Tests.csproj -c Release --no-build
      - name: Build extension for Playwright
        run: dotnet build BrowserComander.sln -c Debug
      - name: Install Chromium for Playwright
        run: pwsh BrowserCommander.E2E.Tests/bin/Debug/net8.0/playwright.ps1 install --with-deps chromium
      - name: Run Playwright E2E tests
        run: dotnet test BrowserCommander.E2E.Tests/BrowserCommander.E2E.Tests.csproj -c Debug --no-build
        env:
          BROWSER_COMMANDER_RUN_E2E: '1'
          BROWSER_COMMANDER_E2E_HEADLESS: '1'
